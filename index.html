<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Status</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="brand">KEYHOLDER</header>

    <main>
      <div class="status-col">
        <section id="status-card" class="status-panel">
          <div id="status-loading">Loading…</div>
        </section>

        <section id="milestones-section" class="milestones-section"></section>
      </div>

      <div class="content-col">
        <section id="stats-section" class="stats-section"></section>

        <section id="profile-section" class="profile-section"></section>

        <section class="history-heading">
          <h2>History</h2>
        </section>
        <section id="history-list" class="history-list"></section>
      </div>
    </main>

    <footer class="footer">
      <span id="last-confirmed"></span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
